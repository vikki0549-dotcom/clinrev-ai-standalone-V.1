# Local development / evaluation: Postgres + app with AUTH_MODE=dev (no IdP, no TLS).
# NEVER expose this to a network. Run from the repository root:
#   docker compose -f deploy/docker-compose.dev.yml up --build
#   open http://localhost:3000
name: clinrev-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinrev
      POSTGRES_USER: clinrev
      POSTGRES_PASSWORD: clinrev-dev-only
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinrev -d clinrev"]
      interval: 5s
      retries: 20

  app:
    build:
      context: ..
    environment:
      NODE_ENV: development
      AUTH_MODE: dev
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-owner@example.com}
      DEV_USER_NAME: ${DEV_USER_NAME:-Dev Owner}
      OWNER_EMAILS: ${DEV_USER_EMAIL:-owner@example.com}
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://clinrev:clinrev-dev-only@postgres:5432/clinrev
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"   # loopback only

volumes:
  pgdata-dev: {}
