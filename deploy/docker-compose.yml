# Production stack: Caddy (automatic HTTPS) -> app (2 replicas) -> Postgres.
# Run from the repository root:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
name: clinrev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinrev
      POSTGRES_USER: clinrev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]          # internal network only: never published
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinrev -d clinrev"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  app:
    build:
      context: ..
    image: clinrev-standalone:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      DATABASE_URL: postgres://clinrev:${POSTGRES_PASSWORD}@postgres:5432/clinrev
      TRUST_PROXY: "1"           # exactly one proxy (Caddy) in front
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2                # real-time updates fan out across replicas via Postgres LISTEN/NOTIFY
    expose: ["3000"]
    networks: [backend, frontend] # frontend gives egress to the IdP and AI provider
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # certificates: keep this volume
      - caddy_config:/config
    networks: [frontend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
